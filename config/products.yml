# An example products file. A deployment points PRODUCTS_FILE at its own
# (this repository's deployment: deploy/products.yml). Paths in it are
# relative to its folder. `bin/rails products:sync` (run on every boot by
# bin/docker-entrypoint) creates or updates the rows; removing an entry
# never deletes a product or its signups.
#
#   name               shown on the form, the pages and in emails
#   site_url           the product's website
#   privacy_url        the notice that describes this waitlist
#   from               sender, "Name <address>" (a verified sender of the SMTP account)
#   reply_to           where replies go
#   notify             emailed when someone confirms (optional; imports never notify)
#   allowed_origins    sites whose scripts may post to the JSON endpoint and frame the form
#   thanks_url         optional: where a plain HTML form post returns to
#   keep_approved_days approved people are deleted this many days after approval (90)
#   places_per_referral  places a confirmed referral moves someone up (5)
#   reminder_days      days an imported unconfirmed person has to confirm (14)
#   questions          optional multiple-choice questions; every answer optional
#   brand              dir (a folder whose png, css, woff2 and txt files are
#                      served at /brands/PRODUCT/FILE), logo (a PNG in it), logo_width, colours (background, card, text,
#                      muted, accent, accent_text, line), font, heading_font,
#                      font_css_url, impressum (the footer's legal line)
#   on_approve         optional webhook run when someone is approved
#                      (app/models/approval_webhook.rb): url, token_file,
#                      id_field, sent_url, labels for the admin
#   approval_email     optional: template (a Subject: line, then the body with
#                      {{variables}} from the webhook's answer) and variables
example:
  name: Example
  site_url: https://example.com
  privacy_url: https://example.com/privacy
  from: Example <hello@example.com>
  reply_to: hello@example.com
  allowed_origins:
    - https://example.com
  questions:
    - question: How did you hear about us?
      options:
        - A friend
        - Search
        - Something else
